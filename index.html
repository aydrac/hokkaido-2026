.fsheet-body{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0;overflow:auto;-webkit-overflow-scrolling:touch}
.fsheet-body.is-frame{overflow:hidden}
.fsheet-body iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.fsheet-back{position:absolute;z-index:2;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);height:36px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:500;letter-spacing:.04em;display:inline-flex;align-items:center;gap:4px;cursor:pointer;box-shadow:0 2px 8px rgba(31,51,70,.12)}
.fsheet-back span{font-size:22px;line-height:1;margin-top:-2px}
.fsheet-back:active{background:var(--sand)}
.fsheet-back:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.fsheet-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:14px;letter-spacing:.1em;pointer-events:none}
.fsheet.loaded .fsheet-load{display:none}
.fsheet-ph{position:relative;min-height:100%;display:grid;place-items:center;padding:80px 28px;text-align:center;color:var(--ink2);font-size:15px;line-height:1.8;background:repeating-linear-gradient(45deg,var(--sand) 0 12px,var(--bg) 12px 24px)}
.fsheet-ph div{background:var(--paper);border-radius:var(--r);padding:20px 22px;max-width:320px}
.fsheet-ph .fake-ly{position:absolute;right:16px;top:14px;height:36px;padding:0 12px;border-radius:999px;border:1px dashed var(--ink3);display:grid;place-items:center;font-size:12px;color:var(--ink3)}
.fsheet-open .scrim{z-index:400}.fsheet-open .toast{z-index:410}
.fd{padding:14px 0 calc(32px + env(safe-area-inset-bottom,0px))}
.fd-hd{min-height:36px;padding:0 16px 0 104px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;line-height:36px}
.fd-hd b{font-family:var(--serif);font-size:19px;letter-spacing:.08em;color:var(--ink)}
.fd-hd span{font-size:12px;color:var(--ink3);white-space:nowrap}
.fd-lb{margin:14px 16px 6px;font-size:11px;letter-spacing:.14em;color:var(--ink3)}
.fd-chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.fd-chips::-webkit-scrollbar{display:none}
.fd-chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.fd-chip small{font-size:11px;color:var(--ink3)}
.fd-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fd-chip.on small{color:inherit;opacity:.7}
.fd-chip.zero{opacity:.45}
.fd-bar{display:flex;justify-content:space-between;align-items:center;margin:14px 16px 4px;font-size:12px;color:var(--ink3)}
.fd-hide{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-size:12px;padding:6px 0;cursor:pointer}
.fd-hide i{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.fd-hide i::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--paper);transition:transform .2s}
.fd-hide.on i{background:var(--maple)}.fd-hide.on i::after{transform:translateX(12px)}
.fd-list{padding:0 16px}
.fd-gh{margin:18px 0 6px;font-family:var(--serif);font-size:15px;letter-spacing:.08em;color:var(--ink);display:flex;align-items:baseline;gap:6px}

.fd-row{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:8px;background:var(--paper);border-radius:var(--r);border:1px solid var(--line)}
.fd-main{flex:1;min-width:0}
.fd-name{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--ink);font-weight:700;font-size:15px;line-height:1.4;text-decoration:none}
.fd-name span:last-child{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.fd-bdg{flex:none;font-size:11px;font-weight:600;line-height:1;padding:3px 6px 3px 4px;border-radius:999px;background:#F6E7B8;color:#7A5A00}
.fd-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12px;color:var(--ink3)}
.fd-meta b{color:var(--ink2);font-weight:600}
.fd-tag{color:var(--t-food)}
.fd-rec{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--ink2)}
.fd-v{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--ink3);cursor:pointer;padding:2px 0}
.fd-v svg{width:30px;height:30px;padding:5px;border-radius:50%;border:1.5px solid var(--line);color:transparent;transition:.15s}
.fd-v small{font-size:10px}
.fd-v.on svg{background:var(--maple);border-color:var(--maple);color:#fff}
.fd-v.on{color:var(--maple)}
.fd-row.done .fd-name,.fd-row.done .fd-rec{opacity:.5}
.fd-ed{display:inline-grid;place-items:center;width:26px;height:26px;margin:-4px 0 -6px 4px;vertical-align:middle;border:0;border-radius:50%;background:none;color:var(--ink3);cursor:pointer}.fd-ed svg{width:15px;height:15px}.fd-ed:active{background:var(--sand)}

.fd-pick svg{width:16px;height:16px}
.fd-pick small{font-size:11px;opacity:.8}
.it-day{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.ovl{grid-column:2;margin-top:6px;padding:8px 12px;border-radius:var(--r);background:#FBEFD9;color:#8A5300;font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.ovl small{font-size:11.5px;opacity:.85}
.ovl-btn{height:30px;padding:0 12px;border-radius:999px;border:1px solid #C98A1E;background:#fff;color:#8A5300;font-size:12.5px;font-weight:600;cursor:pointer}
.it-dur{font:inherit;color:var(--ink);background:none;border:0;padding:6px 0;min-width:0;flex:1}
.packi:disabled{color:inherit;opacity:1;cursor:default}
.iexp .btn:disabled,.clip:disabled,form[data-form=unlock] :disabled{opacity:.4;pointer-events:none}
button[data-act=wtab]:disabled{pointer-events:none}button[data-act=wtab]:disabled:not(.on){opacity:.45}
.mag-frame .cv-nav{display:grid;width:26px;height:48px;border:0;border-radius:0;background:none;font-size:0;padding:0}
.mag-frame .cv-nav::before{content:'';filter:drop-shadow(0 0 2px rgba(255,255,255,.7));width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent}
.mag-frame .cv-nav.prev{left:2px}.mag-frame .cv-nav.next{right:2px}
.mag-frame .cv-nav.prev::before{border-right:11px solid rgba(110,110,110,.55)}
.mag-frame .cv-nav.next::before{border-left:11px solid rgba(110,110,110,.55)}

<style>
@font-face{font-family:'GenYoMin';font-weight:400;font-display:swap;src:url(assets/font-TW-R.woff) format('woff')}@font-face{font-family:'GenYoMin';font-weight:500;font-display:swap;src:url(assets/font-TW-M.woff) format('woff')}@font-face{font-family:'GenYoMin';font-weight:700;font-display:swap;src:url(assets/font-TW-B.woff) format('woff')}@font-face{font-family:'GenYoMinJP';font-weight:400;font-display:swap;src:url(assets/font-JP-R.woff) format('woff')}@font-face{font-family:'GenYoMinJP';font-weight:500;font-display:swap;src:url(assets/font-JP-M.woff) format('woff')}@font-face{font-family:'GenYoMinJP';font-weight:700;font-display:swap;src:url(assets/font-JP-B.woff) format('woff')}
.num{font-family:var(--serif)}
:root{
  --bg:#FCFAF7; --paper:#FFFFFF; --sand:#F2ECE3; --ink:#1F3346; --ink2:#4B5D6B; --ink3:#6B7880;
  --line:#E8D3C5; --sea:#3D6B7B; --sea-soft:#DCEBEA; --maple:#B5562A; --maple-soft:#F6E1D2; --moss:#6E7B55; --peach:#E3A57C; --aqua:#9CC3BE; --navy:#1F3A57;
  --good:#3F7A4E; --warn:#B7791F;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --sky1:#E9EEF0; --sky2:#F5E7D8; --mt1:#9DB2BF; --mt2:#6F8C9E; --mt3:#3F5F75; --leaf1:#C8612F; --leaf2:#D89A3A; --leaf3:#9C3F24; --lake:#C9D8DF;
  --serif:'Playfair Display','GenYoMin','Noto Serif TC',Georgia,serif;
  --ja:'GenYoMinJP','Noto Serif JP','GenYoMin',serif;--jp:'GenYoMin','Noto Serif TC','Noto Serif JP',serif;
  --sans:'GenYoMin','Noto Serif TC','PingFang TC',serif;
  --label:'Inter','GenYoMin','Noto Serif TC',-apple-system,sans-serif;
  --nav-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;

    --good:#7CC08C; --warn:#E0A94A;

  }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#142029; --paper:#1B2A35; --sand:#233441; --ink:#F3ECE1; --ink2:#C2BBAF; --ink3:#9A968E;
  --line:#2C3D4A; --sea:#8DBDC0; --sea-soft:#1E3940; --maple:#E08A5C; --maple-soft:#3D271C; --moss:#A7B48A; --peach:#D9956A; --aqua:#7FAFA9; --navy:#9FB8CF;
  --good:#7CC08C; --warn:#E0A94A;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
  --sky1:#1C2A35; --sky2:#2B2A2E; --mt1:#34495A; --mt2:#2A3D4C; --mt3:#1F3040; --leaf1:#B35428; --leaf2:#B98030; --leaf3:#7E3219; --lake:#22343F;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:28px;padding-top:18px}
.eyebrow{font-family:var(--label);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.h-display{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.02;letter-spacing:.01em;margin:0;text-wrap:balance}
.h-sec{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.h-sec em,.h-display em{font-style:italic;color:var(--maple)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}
.rule{height:1px;background:var(--line);border:0;margin:0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec-head .eyebrow{margin-bottom:6px;display:block}

/* ---------- cover ---------- */
.cover{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:6px}
.cover-top{display:flex;justify-content:space-between;width:100%;align-items:center}
.cover-arch{position:relative;width:78%;max-width:320px;aspect-ratio:3/4;border-radius:999px 999px 0 0;overflow:hidden;background:var(--sky1)}
.cover-arch svg{width:100%;height:100%;display:block}
.cover-line{position:absolute;left:50%;top:-18px;bottom:-24px;width:1px;background:var(--ink);opacity:.5}
.cover-vert{position:absolute;left:0;top:30%;writing-mode:vertical-rl;font-family:var(--jp);font-size:15px;letter-spacing:.5em;color:var(--ink)}
.cover-vert.r{left:auto;right:0;font-family:var(--label);font-size:10px;letter-spacing:.35em;color:var(--ink2)}
.cover-title{font-family:var(--serif);font-size:54px;letter-spacing:.14em;line-height:1;margin:6px 0 0;font-weight:500;padding-left:.14em}
.cover-sub{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--maple);margin-top:-4px}
.cover-meta{font-family:var(--label);font-size:10.5px;letter-spacing:.28em;color:var(--ink2);text-transform:uppercase}

/* ---------- ticker ---------- */
.ticker{border-top:1px solid var(--amber);border-bottom:1px solid var(--amber);overflow:hidden;white-space:nowrap;padding:9px 0;margin:0 -18px}
.ticker-track{display:inline-flex;gap:36px;padding-left:18px;animation:tick 38s linear infinite}
.ticker span{font-size:13px;color:var(--ink)} .ticker b{font-weight:500;color:var(--sea)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;white-space:normal;flex-wrap:wrap}}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dash>div{padding:16px 14px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.dash .big{font-family:var(--serif);font-size:32px;line-height:1.05}
.dash .small{font-size:12px;color:var(--ink2)}
.meter{height:4px;background:var(--sand);border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--sea);border-radius:4px}

/* ---------- focus card ---------- */
.focus{background:var(--paper);border:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.focus-row{display:flex;gap:14px;align-items:flex-start}
.focus-time{font-family:var(--serif);font-size:26px;line-height:1;min-width:70px}
.focus-title{font-size:17px;font-weight:500;line-height:1.35}
.stay-line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;line-height:1.6}
.chip.paid{border-color:transparent;background:var(--sea-soft);color:var(--sea)}
.chip.pending{border-color:transparent;background:var(--maple-soft);color:var(--maple)}
.chip.est{border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:transparent;padding:9px 16px;font-size:13px;letter-spacing:.04em;border-radius:0;color:var(--ink);text-decoration:none}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.sea{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{border-color:var(--line)}
.btn svg{width:15px;height:15px}
.link{color:var(--sea);text-decoration:none;border-bottom:1px solid currentColor;font-size:13px}

/* ---------- plan ---------- */
.daybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 -18px;padding:10px 18px 0;border-bottom:1px solid var(--line)}
.days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.days::-webkit-scrollbar{display:none}
.daytab{flex:0 0 auto;scroll-snap-align:start;background:none;border:0;padding:6px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:0;border-bottom:2px solid transparent;color:var(--ink3)}
.daytab b{font-family:var(--label);font-size:11px;letter-spacing:.18em;font-weight:500}
.daytab span{font-size:12px}
.daytab.on{color:var(--ink);border-color:var(--sea)}
.daytab.today b::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--maple);margin-left:4px;vertical-align:middle}
.dayhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:6px}
.dayhead .vline{width:1px;height:28px;background:var(--ink);opacity:.5}
.infostrip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.infostrip span{display:inline-flex;gap:5px;align-items:center}
.infostrip svg{width:14px;height:14px}
.tl{position:relative;display:flex;flex-direction:column}
.tl::before{content:'';position:absolute;left:62px;top:8px;bottom:8px;width:1px;background:var(--line)}
.ti{position:relative;display:grid;grid-template-columns:52px 1fr;gap:0 20px;padding:10px 0}
.ti .tm{font-family:var(--label);font-size:13px;font-weight:500;letter-spacing:.04em;text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.ti .tm small{display:block;font-size:11px;color:var(--ink3);font-weight:400}

.card-title{flex:1;background:none;border:0;padding:0;text-align:left;font-size:15px;font-weight:500;line-height:1.4;display:flex;flex-direction:column;gap:2px;min-width:0}
.ti.k-move .card-title{font-weight:400;font-size:13.5px;color:var(--ink2)}
.card-title .meta{font-size:12px;color:var(--ink2);font-weight:400;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card-title .meta svg{width:13px;height:13px;flex:0 0 auto}
.ti.done .card-title>span:first-child{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line)}
.check{flex:0 0 auto;width:26px;height:26px;border:1.5px solid var(--ink3);background:transparent;border-radius:50%;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.check.on{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.check.on svg{opacity:1}
.check[disabled]{cursor:default}
.expand{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px;font-size:13.5px}
.expand .sum{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.55;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.mv{font-size:12px;color:var(--ink3);padding:0 0 0 2px;display:flex;gap:6px;align-items:center}
.mv svg{width:13px;height:13px}
.done-at{font-size:11.5px;color:var(--sea)}
.staycard{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:16px}
.arch-sm{aspect-ratio:3/4;border-radius:999px 999px 0 0;border:1px solid var(--sea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:10px 4px 6px}
.arch-sm small{font-family:var(--label);font-size:9px;letter-spacing:.2em;color:var(--ink2)}
.arch-sm b{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--sea)}
.subtotal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--ink);padding-top:12px}

/* ---------- journal ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:transparent;padding:5px 12px;font-size:12.5px;border-radius:999px;color:var(--ink2)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.jday{display:flex;flex-direction:column;gap:14px}
.jday-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.jday-h b{font-family:var(--serif);font-weight:500;font-size:20px}
.jcard{background:var(--paper);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.jcard.polaroid{padding:12px 12px 16px}
.jcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sand)}
.jcard .jt{font-family:var(--serif);font-size:19px;line-height:1.25}
.stars{color:var(--maple);letter-spacing:2px;font-size:13px}
.empty{border:1px dashed var(--line);padding:26px 18px;text-align:center;color:var(--ink2);font-size:13.5px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* ---------- wallet ---------- */
.total-hero{display:flex;flex-direction:column;gap:6px}
.total-hero .yen{font-family:var(--serif);font-size:46px;line-height:1}
.splitbar{display:flex;height:8px;gap:2px;margin-top:8px}
.splitbar i{display:block;height:100%;border-radius:4px}
.legend-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);gap:10px;flex-wrap:wrap}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.fx{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);padding:14px 16px}
.fx-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--label);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;border:0;border-bottom:1px solid var(--ink3);background:transparent;padding:6px 0;font-size:16px;border-radius:0;min-width:0}
.field textarea{border:1px solid var(--line);padding:8px;min-height:70px;resize:vertical;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sea)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink)}
.seg button{background:transparent;border:0;padding:9px;font-size:13.5px;letter-spacing:.06em}
.seg button.on{background:var(--ink);color:var(--paper)}
.xlist{display:flex;flex-direction:column}
.xrow{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.xicon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sand)}
.xicon i{width:10px;height:10px;border-radius:2px}
.xrow .xt{font-size:14.5px;line-height:1.35}
.xrow .xm{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.xrow .xa{text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}
.xrow .xa small{display:block;font-size:11px;color:var(--ink3)}
.xgroup{font-family:var(--label);font-size:11px;letter-spacing:.2em;color:var(--ink2);padding:16px 0 4px;border-bottom:1px solid var(--ink)}
.chart-card{display:flex;flex-direction:column;gap:12px}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:13px}
.donut-legend button{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;background:none;border:0;padding:2px 0;text-align:left}
.donut-legend button.dim{opacity:.4}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;border-bottom:1px solid var(--ink3);position:relative}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;background:none;border:0;padding:0}
.bar i{display:block;width:70%;max-width:22px;background:var(--sea);border-radius:4px 4px 0 0;min-height:2px}
.bar em{position:absolute;font-style:normal;font-size:10px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.barlabels{display:flex;gap:6px}
.barlabels span{flex:1;text-align:center;font-family:var(--label);font-size:10px;letter-spacing:.1em;color:var(--ink2)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;line-height:1.4;max-width:220px}
.paysum{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.paysum div{padding:12px 8px 0;display:flex;flex-direction:column;gap:2px}
.paysum div+div{border-left:1px solid var(--line);padding-left:12px}

/* ---------- info ---------- */
.toc{display:flex;flex-direction:column;gap:8px}
.toc details{background:var(--paper);border:1px solid var(--line)}
.toc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;gap:12px}
.toc summary::-webkit-details-marker{display:none}
.toc summary .eyebrow{color:var(--ink);letter-spacing:.3em}
.toc summary svg{width:16px;height:16px;transition:transform .2s;color:var(--ink2)}
.toc details[open] summary svg{transform:rotate(45deg)}
.toc .body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:16px}
.flight{display:grid;grid-template-columns:26px 1fr;gap:12px}
.flight .ic{width:26px;height:26px;border-radius:50%;background:var(--sea);color:var(--paper);display:grid;place-items:center}
.flight .ic svg{width:14px;height:14px}
.frow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.frow b{font-family:var(--serif);font-weight:500;font-size:20px}
.accom{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.accom:last-child{border-bottom:0;padding-bottom:0}
.accom-name{font-family:var(--serif);font-size:19px;line-height:1.25}
.inout{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:260px}
.inout .arch-sm{aspect-ratio:auto;padding:14px 6px 10px}
.packg{display:flex;flex-direction:column;gap:6px}
.packg h4{margin:0;font-family:var(--label);font-size:11px;letter-spacing:.2em;font-weight:500;color:var(--ink2)}
.packi{display:flex;gap:10px;align-items:center;font-size:14px;background:none;border:0;padding:4px 0;text-align:left}
.packi .check{width:22px;height:22px}
.packi.on span{color:var(--ink3);text-decoration:line-through}
.erow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.erow:last-child{border-bottom:0}
.erow b{font-family:var(--label);font-weight:500;font-size:15px;letter-spacing:.04em;user-select:all;white-space:nowrap}
.vault-lines{display:flex;flex-direction:column}
.vline{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--line);gap:2px}
.vline small{font-size:11.5px;color:var(--ink3)}
.vline span{font-size:14px;word-break:break-all;user-select:all}
.note-box{background:var(--maple-soft);color:var(--ink);padding:12px 14px;font-size:13px;line-height:1.55}
.note-box b{color:var(--maple);font-weight:500}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.nav button{background:none;border:0;display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink3);padding:0;position:relative}
.nav button svg{width:26px;height:26px;transition:transform .15s}
.nav button.on{color:var(--ink)}
.nav button.on svg{transform:translateY(-3px)}
.nav button.on::after{content:'';position:absolute;bottom:14px;width:5px;height:5px;background:var(--maple);border-radius:50%}
.nav .plus .pc{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg);transform:translateY(-14px)}
.nav .plus.on svg{transform:none}
.nav .plus.on::after{bottom:6px}
.nav .plus .pc svg{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){.nav button svg{transition:none}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,25,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;padding:6px;color:var(--ink2)} .x svg{width:20px;height:20px}
.typechips{display:flex;flex-wrap:wrap;gap:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.amt{display:flex;align-items:flex-end;gap:8px}
.amt input{font-family:var(--serif);font-size:30px !important}
.curtoggle{display:flex;border:1px solid var(--ink)}
.curtoggle button{background:none;border:0;padding:5px 10px;font-size:13px}
.curtoggle button.on{background:var(--ink);color:var(--paper)}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:24px;color:var(--line);padding:0 2px;line-height:1}
.starpick button.on{color:var(--maple)}
.photo-pick{border:1px dashed var(--ink3);padding:14px;text-align:center;font-size:13px;color:var(--ink2);display:block;cursor:pointer}
.photo-pick img{max-height:160px;margin:0 auto;display:block}
.sheet-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-top:4px}
.danger{color:var(--maple);background:none;border:0;font-size:13px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;font-size:13px;z-index:90;max-width:90vw}
.modebadge{font-size:11px;color:var(--ink3);text-align:center;padding-top:8px}

/* ---------- report ---------- */
.report{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto}
.report .app{padding-bottom:60px}
.rep-day{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rep-day b{font-family:var(--serif);font-weight:500;font-size:22px}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.rank i{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--maple)}

/* ---------- home (magazine cover) ---------- */
.home{gap:30px}
.mag{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.mag-top{display:flex;justify-content:space-between;font-family:var(--label);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
.mag-frame{position:relative;display:flex;flex-direction:column;--tf:clamp(37px,11.7vw,65px)}
.mag-head{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.mag-title{margin:0;font-family:var(--jp);font-weight:700;font-size:var(--tf);line-height:1;letter-spacing:.1em;padding-left:.1em;white-space:nowrap;text-align:center;color:var(--ink);text-shadow:var(--title-glow)}
.mag-photo{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--sand);margin-top:calc(var(--tf) * .5)}
.mag-photo img{width:100%;height:100%;object-fit:cover;display:block}
.mag-photo::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(255,255,255,.28) 0%,rgba(255,255,255,.08) 5%,rgba(20,28,36,.34) 9.5%,rgba(20,28,36,.3) 16%,rgba(20,28,36,0) 26%,rgba(20,28,36,0) 58%,rgba(20,28,36,.55) 76%,rgba(20,28,36,.8) 100%)}
.mag-sub{margin:0;text-align:center;color:#fff;font-size:11px;font-weight:400;letter-spacing:.08em;white-space:nowrap;padding:0 8px;text-shadow:0 0 2px rgba(0,0,0,.55),0 1px 8px rgba(0,0,0,.7)}
.mag-cols{position:absolute;z-index:3;left:8%;right:8%;bottom:42px;display:grid;grid-template-columns:repeat(3,1fr);color:#fff;text-align:center}
.mag-cols>div{display:grid;grid-template-rows:18px auto 13px;justify-items:center;align-items:center;row-gap:2px;padding:0 5px}
.mag-cols>div+div{border-left:1px solid rgba(255,255,255,.8)}
.mag-cols b{font-size:11.5px;font-weight:500;letter-spacing:.1em;line-height:1.2}
.mag-cols .cake{width:18px;height:18px;display:block}
.mag-cols span{font-size:9px;font-weight:300;line-height:1.35;letter-spacing:.04em;opacity:.95;align-self:start}
.mag-cols em{font-style:normal;font-family:var(--label);font-size:9px;font-weight:400;letter-spacing:.1em;opacity:.85;white-space:nowrap}
.mag-foot{position:absolute;z-index:3;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:9.5px;letter-spacing:.36em;font-weight:300}
.shippo-band{height:22px;color:var(--maple);opacity:.55}
.shippo{width:100%;height:100%;display:block}
.home .ticker span{font-size:13px}
.hdash{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.htile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);padding:16px 14px;min-width:0}
.htile:active{background:var(--sand)}
.hlabel{font-size:12.5px;font-weight:500;letter-spacing:.14em;color:var(--maple)}
.hbig{font-family:var(--serif);font-size:26px;line-height:1.1;color:var(--ink)}
.hbig small{font-size:14px}
.hsmall{font-size:12px;color:var(--ink2)}
.hgo{font-size:12px;color:var(--sea);margin-top:4px;letter-spacing:.06em}
.h-jp{font-family:var(--jp);font-weight:700;font-size:26px;line-height:1.2;margin:4px 0 0;letter-spacing:.06em}
.hfocus .focus-time{font-size:26px}
.hfocus .focus-title{font-size:16px}
.hfocus .stay-line{font-size:13.5px}
.hfocus .note-box{font-size:13px}
.hfocus .btn{font-size:13px;padding:10px 16px}
.hfocus .chip{font-size:12px}
.home .modebadge{font-size:11px}
@media (max-width:360px){.mag-cols b{font-size:10.5px}.mag-cols span{font-size:8.5px}.mag-cols em{font-size:8.5px}.mag-sub{font-size:10px;letter-spacing:.04em}}

/* ---------- rounded thin-line boxes ---------- */
:root{--r:14px;--r-sm:10px}
.focus,.card,.staycard,.jcard,.empty,.fx,.toc details,.htile,.photo-pick,.note-box{border-radius:var(--r)}
.toc details{overflow:hidden}
.ti.k-move .card{border-radius:0}
.btn,.seg,.curtoggle,.field textarea{border-radius:var(--r-sm)}
.seg,.curtoggle{overflow:hidden}
.arch-sm{border-radius:999px 999px var(--r-sm) var(--r-sm)}
.jcard img{border-radius:var(--r-sm)}
.sheet{border-radius:18px 18px 0 0}
.xicon{border-radius:50%}

:root{--title-glow:0 0 6px rgba(255,255,255,.85),0 0 14px rgba(255,255,255,.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--title-glow:0 0 6px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--title-glow:0 0 6px rgba(0,0,0,.7),0 0 14px rgba(0,0,0,.5)}

/* ---------- metallic gold-orange thin frames (site-wide) ---------- */
:root{--metal:linear-gradient(#D69A74,#D69A74);--amber:#D69A74}
.focus,.ti:not(.k-move) .card,.staycard,.jcard,.fx,.toc details,.htile{
  position:relative;overflow:hidden;border:1.5px solid transparent;
  background:linear-gradient(var(--paper),var(--paper)) padding-box,var(--metal) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .focus,:root:not([data-theme="light"]) .ti:not(.k-move) .card,:root:not([data-theme="light"]) .staycard,:root:not([data-theme="light"]) .jcard,:root:not([data-theme="light"]) .fx,:root:not([data-theme="light"]) .toc details,:root:not([data-theme="light"]) .htile{box-shadow:inset 0 1px 0 rgba(255,236,196,.18)}}
:root[data-theme="dark"] .focus,:root[data-theme="dark"] .ti:not(.k-move) .card,:root[data-theme="dark"] .staycard,:root[data-theme="dark"] .jcard,:root[data-theme="dark"] .fx,:root[data-theme="dark"] .toc details,:root[data-theme="dark"] .htile{box-shadow:inset 0 1px 0 rgba(255,236,196,.18)}

html:has(body.wave){background:var(--wave-base)}
body.wave{background-color:var(--wave-base);background-image:var(--washi),var(--wave-bg);background-size:300px 300px,28px 14px;background-repeat:repeat,repeat}

/* 已花費／待付款：無邊框、浮起 2px */
.htile{border:0!important;background:var(--paper)!important;transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,51,70,.06),0 8px 18px rgba(31,51,70,.10)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .htile{box-shadow:0 2px 4px rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.35)!important}}
:root[data-theme="dark"] .htile{box-shadow:0 2px 4px rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.35)!important}

/* ---------- plan v2 ---------- */
.daytab b{font-family:var(--label);font-size:13px;letter-spacing:.06em;font-weight:500}
.daytab span{font-size:11px;letter-spacing:.04em}
.route-jp{font-family:var(--jp);font-size:13px;letter-spacing:.14em;color:var(--ink2)}
.day-sub{font-size:14px;color:var(--maple);letter-spacing:.06em}
.pcard{display:grid!important;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px!important;min-height:84px}
.thumb{position:relative;width:64px;height:64px;flex:0 0 auto;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--sand);display:grid;place-items:center;padding:0;overflow:hidden;color:var(--ink3);transition:width .2s,height .2s}
.thumb svg{width:20px;height:20px;opacity:.55}
.thumb.has{border-color:transparent}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.ti.open .pcard{grid-template-columns:1fr auto}
.ti.open .thumb{grid-column:1;grid-row:1;width:100%;height:auto;aspect-ratio:4/3}
.ti.open .thumb.has{aspect-ratio:auto}
.ti.open .thumb.has img{position:static;height:auto;object-fit:contain}
.ti.open .pencil{grid-column:2;grid-row:1}
.ti.open .pc-main{grid-column:1/-1;grid-row:2}
.pc-main{min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.pencil{background:none;border:0;padding:4px;color:var(--amber);opacity:.9}
.pencil svg{width:18px;height:18px}
.tm-tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-top:10px}
.ibtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--amber);background:var(--paper);color:var(--sea);display:grid;place-items:center;padding:0;text-decoration:none}
.ibtn svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.thumb{transition:none}}
.staycard{grid-template-columns:112px 1fr!important;padding:0!important;gap:0!important;align-items:stretch!important}

.lightbox{position:fixed;inset:0;z-index:95;background:rgba(10,14,18,.92);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
.lb-x svg{width:22px;height:22px}

.stay-pat.np1{background-image:url(assets/pat-1.jpg)}.stay-pat.np2{background-image:url(assets/pat-2.jpg)}.stay-pat.np3,.stay-pat.np4{background-image:url(assets/pat-3.jpg)}.stay-pat.np5{background-image:url(assets/pat-4.jpg)}.stay-pat.np6,.stay-pat.np7,.stay-pat.np8{background-image:url(assets/pat-5.jpg)}

.stay-pat b{font-family:var(--sans)!important;font-weight:700!important;font-size:26px!important;letter-spacing:.02em}

.subtotal-jp{font-family:var(--jp);font-size:13px;letter-spacing:.16em;color:var(--ink2)}

:root{--plus-bg:#8E3F1C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plus-bg:#B8653A}}
:root[data-theme="dark"]{--plus-bg:#B8653A}
.nav .plus .pc{background:var(--plus-bg)!important;color:#fff!important}

/* ---------- journal v2 ---------- */
.jp-eyebrow{font-family:var(--jp);font-size:13px;letter-spacing:.24em;color:var(--ink2);display:block;margin-bottom:6px}
.btn.jnew{background:var(--plus-bg);border-color:var(--plus-bg);color:#fff}
.jfilters .fchip.on{background:var(--maple-soft);border-color:transparent;color:var(--maple)}
.jp-row{display:flex;gap:10px;flex-wrap:wrap}
.jp-th{position:relative;width:84px;height:84px;border-radius:var(--r-sm);overflow:hidden;background:var(--sand)}
.jp-th img{width:100%;height:100%;object-fit:cover;display:block}
.jp-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;padding:0}
.jp-x svg{width:14px;height:14px}
.jp-add{width:84px;height:84px;border-radius:var(--r-sm);border:1px dashed var(--ink3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);cursor:pointer;font-size:11px}
.jp-add svg{width:20px;height:20px}
.jc-ph{display:grid;gap:4px;border-radius:var(--r-sm);overflow:hidden}
.jc-ph.n2{grid-template-columns:1fr 1fr}
.jc-ph.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.jc-ph.n3 img:first-child{grid-row:1/3}
.jc-ph img{border-radius:0!important;aspect-ratio:auto!important;height:100%;min-height:0}
.jc-ph.n1 img{aspect-ratio:4/3!important}
.jc-ph.n2 img{aspect-ratio:3/4!important}
.jc-ph.n3{aspect-ratio:4/3}

.report{background-color:var(--wave-base);background-image:var(--washi),var(--wave-bg);background-size:300px 300px,28px 14px}

/* ---------- wallet v2（花費頁定案） ---------- */
:root{--k-food:#BA5839;--t-food:#BA5839;--k-shop:#D98B50;--t-shop:#B86E36;--k-stay:#C8B195;--t-stay:#8F7757;--k-act:#8CAE9E;--t-act:#5E8474;--k-trans:#4F7285;--t-trans:#4F7285;--k-other:#23395B;--t-other:#23395B;
  --w-shadow:0 2px 4px rgba(31,51,70,.05),0 8px 20px rgba(31,51,70,.08);--w-soft:#F7F4EE;--w-track:#F2EFE9;--w-grid:#ECE6DD}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k-other:#5C7AA6;--t-food:#E08E72;--t-shop:#E3A474;--t-stay:#D5C1A2;--t-act:#A5C8B8;--t-trans:#8FB2C9;--t-other:#A9BCD8;
  --w-shadow:0 2px 4px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);--w-soft:#233441;--w-track:#16232D;--w-grid:#2C3D4A}}
:root[data-theme="dark"]{--k-other:#5C7AA6;--t-food:#E08E72;--t-shop:#E3A474;--t-stay:#D5C1A2;--t-act:#A5C8B8;--t-trans:#8FB2C9;--t-other:#A9BCD8;
  --w-shadow:0 2px 4px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);--w-soft:#233441;--w-track:#16232D;--w-grid:#2C3D4A}
.wallet{gap:16px}
.wallet>header{margin-bottom:4px}
.wbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-bottom:-4px}
.wbar-in{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:14px;padding:4px 4px 4px 12px;box-shadow:0 1px 3px rgba(31,51,70,.10),0 4px 12px rgba(31,51,70,.08)}
.wbar .gl{font-size:11px;letter-spacing:.2em;color:var(--ink3);margin-right:2px}
.pseg{display:flex;background:var(--w-track);border-radius:10px;padding:3px}
.wbar .pseg{background:var(--w-track)}
.pseg button{border:0;background:none;font-size:12px;padding:5px 12px;border-radius:8px;color:var(--ink2);line-height:1.4}
.pseg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.wbar .pseg button.on{background:var(--ink);color:var(--paper);box-shadow:none}
.wcard{background:var(--paper);border-radius:16px;box-shadow:var(--w-shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wcard .lbl{font-size:12px;letter-spacing:.14em;color:var(--ink3)}
.wbig{font-family:var(--serif);font-size:40px;line-height:1.1;margin-top:-4px}
.wsub{font-size:13px;color:var(--ink2);margin-top:-10px}
.cbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin-top:2px}
.cbar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.wrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}
.wrow2 button{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.wrow2 b{font-family:var(--serif);font-size:20px;font-weight:500}
.wrow2 small{font-size:11px;color:var(--ink3)}
/* fx */
.fxtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.live{font-size:11px;color:var(--sea);display:inline-flex;align-items:center;gap:6px}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink3)}.live.on::before{background:var(--k-act)}
.io{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:center}
.box{background:var(--w-soft);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;min-width:0;cursor:text}
.box small{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.fxv{display:flex;align-items:baseline;gap:3px;min-width:0}
.fxv em{font-style:normal;font-family:var(--serif);font-size:16px;color:var(--ink2)}
.fxv input{border:0;background:none;padding:0;width:100%;min-width:0;font-family:var(--serif);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.fxv input:focus{outline:none}
.swp{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--amber);display:grid;place-items:center;color:var(--k-trans);font-size:16px;padding:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:12px;padding:5px 11px;border-radius:999px;background:var(--maple-soft);color:var(--maple);border:0}
.quick button.on{background:var(--maple);color:#fff}
.fxnote{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink3)}
.fxnote .rate{display:inline-flex;align-items:center;gap:6px;letter-spacing:.06em}
.fxnote .rate input{width:62px;border:0;border-bottom:1px solid var(--ink3);background:none;font-size:13px;padding:2px 0;text-align:center;color:var(--ink)}
.btn.wadd{background:var(--plus-bg);border-color:var(--plus-bg);color:#fff}
/* card head */
.wh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.wh small{display:block;font-family:var(--jp);font-size:11px;letter-spacing:.24em;color:var(--ink2)}
.wh b{font-family:var(--jp);font-size:22px;font-weight:700;letter-spacing:.04em}
/* bars */
.tg{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2)}
.swt{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;border:0;padding:0;flex:none}
.swt::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.swt.on{background:var(--plus-bg)}.swt.on::after{left:16px}
.bars2 svg{display:block;overflow:visible}
.bars2 .gl{stroke:var(--w-grid);stroke-width:1}
.bars2 .ax{font-size:9px;fill:var(--ink3)}.bars2 .ax.wd{font-size:8px}.bars2 .ax.on{fill:var(--ink);font-weight:600}
.bars2 .bv{font-size:10px;font-weight:600;fill:var(--ink);font-variant-numeric:tabular-nums}
.bars2 .leg{font-size:11px;gap:6px 12px}.bars2 .leg i{width:9px;height:9px;border-radius:2px}
.det{background:var(--w-soft);border-radius:12px;padding:12px 14px}
.det .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:6px}
.det .t b{font-family:var(--serif);font-size:18px;font-weight:500;white-space:nowrap}
.det .r,.avg .ar{display:grid;grid-template-columns:12px 1fr auto 44px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.det .r i{width:10px;height:10px;border-radius:3px}.det .r b{font-weight:500}.det .r em,.avg .ar em{font-style:normal;color:var(--ink3);text-align:right;font-size:12px}
.avg{border-top:1px dashed var(--line);padding-top:10px}
.avg-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:4px;gap:8px}
.avg .ar{grid-template-columns:1fr auto 92px}
.avg .ar span{display:inline-flex;align-items:center;gap:6px}.avg .ar span i{width:9px;height:9px;border-radius:2px}
.avg .ar b{font-weight:500}.avg .ar.tot{font-size:14px}.avg .ar.tot b{font-family:var(--serif);font-size:17px}
.wcard .nt{font-size:10.5px;color:var(--ink3);line-height:1.5}
/* donut */
.dn svg{width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.dn text{font-family:var(--sans)}
.dn .hint{font-size:11px;color:var(--ink3);text-align:center;margin-top:-6px}
.dchips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dchip{border:0;border-radius:12px;padding:8px 6px;background:var(--w-soft);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.dchip i{width:10px;height:10px;border-radius:3px;display:block}
.dchip span{font-size:13px}.dchip em{font-style:normal;font-size:11px;color:var(--ink3)}
.dchip.on{background:var(--paper);box-shadow:0 0 0 1.5px var(--c) inset}
.dchip.dim,.dchip:disabled{opacity:.45}
/* list */
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--w-track);border-radius:12px;padding:3px}
.tabs3 button{border:0;background:none;padding:7px 0;border-radius:10px;font-size:13px;color:var(--ink2);line-height:1.35}
.tabs3 button em{display:block;font-style:normal;font-family:var(--serif);font-size:13px;color:var(--ink3)}
.tabs3 button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(31,51,70,.15)}.tabs3 button.on em{color:var(--ink)}
.fl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.fl::-webkit-scrollbar{display:none}
.fl .fc{flex:none;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--w-soft);color:var(--ink2);border:0;display:inline-flex;align-items:center;gap:5px}
.fl .fc i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.fl .fc.on{background:var(--ink);color:var(--paper)}
.dgrp{display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding:8px 0 6px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.dh b{font-family:var(--jp);font-size:15px;letter-spacing:.06em;font-weight:700}.dh b small{font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink3);margin-left:6px;letter-spacing:.1em}
.dh>span{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:14px;color:var(--ink2)}
.dh .n{font-style:normal;font-family:var(--sans);font-size:11px;color:var(--ink3)}
.cv{width:7px;height:7px;border:solid var(--ink3);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:-3px 2px 0 2px;display:inline-block}
.dh.cl .cv{transform:rotate(-45deg);margin-top:0}
.xr{position:relative;overflow:hidden;border-bottom:1px dashed var(--line)}
.dgrp .xr:last-child{border-bottom:0}
.xr-del{position:absolute;right:0;top:0;bottom:0;width:76px;border:0;background:var(--maple);color:#fff;font-size:13px;letter-spacing:.1em}
.xr-in{position:relative;display:grid;grid-template-columns:34px 1fr auto 26px;gap:10px;align-items:center;padding:10px 0;background:var(--paper);transition:transform .2s ease;touch-action:pan-y;cursor:pointer}
@media (prefers-reduced-motion:reduce){.xr-in{transition:none}}
.xr .ic{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,var(--paper));color:var(--t);display:grid;place-items:center;font-size:11px;font-weight:500;letter-spacing:0}
.xr .tt{min-width:0;display:flex;flex-direction:column}
.xr .tt b{font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xr .tt small{font-size:11px;color:var(--ink3)}
.xr .tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--maple-soft);color:var(--maple);margin-left:5px}
.xr .am{text-align:right;display:flex;flex-direction:column}
.xr .am b{font-family:var(--serif);font-weight:500;font-size:16px}
.xr .am small{font-size:11px;color:var(--ink3)}
.xr .am.est b{color:var(--ink3)}
.xr .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--amber);background:none;padding:0;position:relative}
.xr .ck.done{background:var(--k-act);border-color:var(--k-act)}
.xr .ck.done::after{content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.addmini{width:34px;height:34px;border-radius:50%;border:0;background:var(--plus-bg);color:#fff;display:grid;place-items:center;padding:0}
.addmini svg{width:18px;height:18px}
.xl .nt{text-align:center;margin-top:6px}
.donut-legend .dl{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:2px 0}
/* toast undo */
.toast{display:flex;align-items:center;gap:14px}
.toast[hidden]{display:none}
.toast-undo{background:none;border:0;color:var(--peach);font-size:13px;padding:0;letter-spacing:.1em}
/* expense sheet（m2） */
.xs{display:flex;flex-direction:column;gap:18px}
.xs-ttl{display:flex;align-items:center;gap:10px}
.xs-ttl b{font-family:var(--jp);font-size:24px;font-weight:700;margin-right:auto}
.xs-ttl span{font-family:var(--jp);font-size:12px;letter-spacing:.24em;color:var(--ink3)}
.xs-lb{font-size:11px;letter-spacing:.16em;color:var(--ink2);margin-bottom:8px;font-family:var(--sans)!important;text-transform:none!important}
.field .xs-lb{margin-bottom:0}
.xs-amt{display:flex;align-items:flex-end;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.xs-amt input{flex:1;min-width:0;border:0;background:none;padding:0;font-family:var(--serif);font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.xs-amt input:focus{outline:none}
.xs-cur{display:flex;border:1px solid var(--ink);border-radius:10px;overflow:hidden;flex:none}
.xs-cur button{border:0;background:none;padding:6px 12px;font-size:14px}
.xs-cur button.on{background:var(--ink);color:var(--paper)}
.xs-fixed{font-size:15px;color:var(--ink2);padding-bottom:6px}
.xs-conv{font-size:12px;color:var(--ink3);margin-top:6px;min-height:18px}
.xs-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xs-cat{border:0;border-radius:12px;padding:10px 6px;font-size:14px;background:color-mix(in srgb,var(--c) 14%,var(--paper));color:var(--c);display:flex;flex-direction:column;align-items:center;gap:4px}
.xs-cat svg{width:22px;height:22px}
.xs-cat.on{background:var(--c);color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 40%,transparent)}
.xs-subs{display:flex;flex-wrap:wrap;gap:8px}
.xs-sub{padding:6px 14px;border-radius:999px;font-size:13px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--paper));color:var(--c);background:none}
.xs-sub.on{background:var(--c);color:#fff;border-color:var(--c)}
.xs-pills{display:flex;gap:8px;flex-wrap:wrap}
.xs-pills button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink2);background:none}
.xs-pills button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.xs-fixedti{font-size:15px;font-weight:500}
.btn.xs-save{background:var(--plus-bg);border-color:var(--plus-bg);color:#fff;padding:11px 22px}

/* ---------- wallet v3 ---------- */
.view.wallet{padding-top:6px;gap:14px}
.whead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.whead .jp-eyebrow{margin-bottom:2px}
.whead .h-display{font-size:38px}
.wtg{display:flex;gap:6px;margin-bottom:6px}
.wtg button{min-width:44px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--amber);background:var(--paper);color:var(--ink);font-size:13px;letter-spacing:.04em}
.wtg button:active{background:var(--sand)}
.wtg .wshow{display:inline-flex;align-items:center;gap:3px;color:var(--ink-2,var(--ink))}
.wtg .wshow svg{width:14px;height:14px}
.wtg .wshow.on{background:var(--amber);color:#fff}
.wadd-row{padding-top:12px;border-top:1px dashed var(--line)}
.wadd-row .btn{width:100%;justify-content:center}
.rateb{background:none;border:0;padding:0;font-size:11px}
.rateb b{font-weight:600;color:var(--maple)}
.rateb svg{width:12px;height:12px;vertical-align:-2px;color:var(--amber)}
.rateb2{font-size:11px;background:none;border:0;padding:0}
.wtabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin-top:4px}
.wtab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0 10px;font-size:14px;letter-spacing:.08em;color:var(--ink3)}
.wtab.on{color:var(--ink);border-bottom:3px solid var(--sea)}
.dh>span .num{font-size:17px;color:var(--ink)}
.wh small{font-size:12px}
.dn .wh,.xl .wh{margin-bottom:-4px}

/* ---------- wallet v4 ---------- */
.wtabs{grid-template-columns:repeat(4,1fr);position:sticky;top:0;z-index:25;background:var(--bg);margin:0 -18px;padding:calc(env(safe-area-inset-top,0px) + 4px) 18px 0}
.wtab{font-size:15px;font-weight:700;letter-spacing:.04em;padding:10px 0 11px;white-space:nowrap}
.wbig{font-size:32px}
.subsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ss{border:0;border-radius:10px;padding:7px 8px;background:color-mix(in srgb,var(--c) 10%,var(--paper));display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;color:var(--ink)}
.ss span{font-size:12px;color:var(--t)}.ss b{font-family:var(--serif);font-weight:500;font-size:15px}.ss small{font-size:10px;color:var(--ink3)}

/* 行李清單 */
.icard-h + .packg{margin-top:-6px}
.packg + .packg{border-top:1px dashed color-mix(in srgb,var(--amber) 60%,var(--paper));padding-top:12px}
.packrow{display:flex;align-items:center;gap:6px}
.packrow .packi{flex:1}
.packdel{background:none;border:0;color:var(--ink3);padding:4px;display:grid;place-items:center}
.packdel svg{width:14px;height:14px}
.packnew{display:flex;align-items:center;gap:10px;padding:4px 0}
.packnew .check{width:22px;height:22px;border-style:dashed}
.packnew input{flex:1;min-width:0;border:0;border-bottom:1px dashed color-mix(in srgb,var(--amber) 60%,var(--paper));background:none;font:inherit;font-size:14px;padding:4px 0;color:var(--ink)}
.packnew input:focus{outline:none;border-bottom-color:var(--maple)}
.packplus{width:28px;height:28px;border-radius:50%;border:1px solid var(--amber);background:var(--paper);color:var(--maple);display:grid;place-items:center;padding:0}
.packplus svg{width:14px;height:14px}
/* 資訊卡標題右側 icon */
.icard-h .ih-r{margin-left:auto;align-self:center}
/* 住宿圖：新和柄已淡，覆蓋減輕 */
.stl-band::before{opacity:.12}
/* 花費明細勾選圈比照行李清單 */
.xr .ck{border:1.5px solid color-mix(in srgb,var(--t-food) 45%,var(--paper))}
.xr .ck.done{background:var(--maple);border-color:var(--maple)}
/* ===== v6.6 ===== */
.htile .hsmall{font-size:13px}
.jf-note.plain{background:linear-gradient(var(--paper),var(--paper)) padding-box,var(--metal) border-box;line-height:1.7;padding:10px 14px}
.it-ph{width:100%;aspect-ratio:16/9;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;overflow:hidden;position:relative}
.it-ph.add{border:1.5px dashed var(--amber);background:var(--paper);color:var(--maple);font:inherit;font-size:14px}
.it-ph.empty{border:1.5px dashed var(--line);background:color-mix(in srgb,var(--amber) 8%,var(--paper));color:var(--ink3)}
.it-ph svg{width:24px;height:24px}
.it-ph.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.it-ph-act{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.it-ph-act button{background:rgba(250,246,238,.92);border:1px solid var(--amber);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink)}
.it-tm{flex:none;display:flex;align-items:center;gap:4px;border:1px solid var(--amber);border-radius:999px;padding:2px 10px;color:var(--ink2)}
.it-tm svg{width:15px;height:15px}
.it-tm input{border:0;background:none;font-family:var(--serif);font-size:16px;color:var(--ink);padding:2px 0;width:auto;min-width:0}
.it-tm input:focus{outline:none}
.it-tm input::-webkit-calendar-picker-indicator{display:none}
/* ===== v6.7 ===== */
.ti.k-move .dot{left:50px}
.ti.k-move .card{position:relative;padding-right:34px}
.ti.k-move .mv-edit{position:absolute;top:-2px;right:0}
/* 資訊住宿帶：深色模式固定淺底深字（同行程今夜の宿） */
.stl-band::before{background:#FAF6EE}
.stl-band small,.stl-band b,.stl-mid{color:#1F3346!important;text-shadow:0 0 5px #fff,0 0 11px #fff!important}
.stl-t small{color:#1F3346!important}
.stl-mid::before,.stl-mid::after{border-top-color:#1F3346}
.view.info .whead,.view.journal .whead{margin-bottom:4px}
/* ===== 封面輪播 ===== */
.mag-frame{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mag-frame:focus-visible{outline:2px solid var(--maple);outline-offset:4px}
.mag-head,.mag-cols,.mag-foot{pointer-events:none}
.mag-photo .cv-s{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease;-webkit-user-drag:none}
.mag-photo .cv-s.on{opacity:1}
.cv-dots{position:absolute;z-index:4;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:7px}
.cv-dots button{width:6px;height:6px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5);transition:background .3s,transform .3s}
.cv-dots button.on{background:#fff;transform:scale(1.3)}
.cv-nav{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(20,28,36,.25);color:#fff;font-size:20px;line-height:1;display:none;place-items:center;padding:0 0 2px}
.cv-nav.prev{left:10px}.cv-nav.next{right:10px}
@media (hover:hover) and (pointer:fine){.cv-nav{display:grid}}
@media (prefers-reduced-motion:reduce){.mag-photo .cv-s{transition:none}}
/* ===== 時間軸小鳥＋進度線 ===== */
:root{--prog:#1F3346}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--prog:#9FB8CF}}
:root[data-theme="dark"]{--prog:#9FB8CF}
.tl-prog{position:absolute;left:52px;top:0;width:3px;height:0;border-radius:3px;background:var(--prog);z-index:1;pointer-events:none}
.ti .dot{z-index:2}
.ti.past .dot{background:var(--prog);border-color:var(--prog)}
.tl .bird{position:absolute;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none}
.tl .bird img{position:absolute;width:44px;height:44px;max-width:none;opacity:0;user-select:none;-webkit-user-drag:none}
.tl .bird img.on{opacity:1}

</style>
</head>

<div class="app"><main id="main" aria-live="polite"></main></div>
<nav id="nav" class="nav" aria-label="主選單"></nav>
<div id="boot"></div>
<script src="boot.js"></script>
<script>BOOT.start('app');</script>
